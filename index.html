<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17365D">
<title>百麒設備巡視檢查</title>
<style>
:root{
  --navy:#17365D;
  --blue:#2F75B5;
  --light:#F4F7FB;
  --line:#D8E0EA;
  --green:#2E7D32;
  --red:#C62828;
  --amber:#F59E0B;
  --text:#1F2937;
  --muted:#6B7280;
  --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--light);
  color:var(--text);
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:white;padding:14px 16px 12px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px}
.sub{font-size:12px;opacity:.85;margin-top:3px}
.wrap{max-width:980px;margin:auto;padding:14px 12px 90px}
.top-card{
  background:white;border-radius:16px;padding:14px;
  box-shadow:0 3px 14px rgba(23,54,93,.08);margin-bottom:12px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.small{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea,button{font:inherit}
input[type="date"],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:11px 12px;color:var(--text);
}
textarea{min-height:76px;resize:vertical}
.progress-wrap{margin-top:12px}
.progress-line{height:10px;background:#E8EEF6;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#43A047,#66BB6A);transition:.25s}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.time-strip{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;
}
.time-strip::-webkit-scrollbar{display:none}
.time-btn{
  flex:0 0 auto;border:1px solid #C9D5E5;background:white;color:var(--navy);
  border-radius:999px;padding:9px 13px;font-weight:700;
}
.time-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.time-btn.done::after{content:" ✓";color:#79D57F}
.section-title{
  margin:16px 2px 8px;font-size:14px;font-weight:800;color:var(--navy);
  display:flex;align-items:center;gap:8px;
}
.section-title::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--blue)}
.item{
  background:var(--card);border-radius:14px;padding:13px;margin-bottom:9px;
  border:1px solid #E6ECF3;box-shadow:0 2px 8px rgba(23,54,93,.05);
}
.item-head{display:flex;gap:10px;align-items:flex-start}
.num{
  flex:0 0 30px;height:30px;border-radius:9px;background:#EAF2FB;color:var(--navy);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
}
.item-text{flex:1;font-size:15px;line-height:1.55;font-weight:650}
.status-row{display:flex;gap:8px;margin-top:11px}
.status-btn{
  flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 6px;font-weight:800;
}
.status-btn.ok.active{background:#E8F5E9;color:var(--green);border-color:#9FD4A2}
.status-btn.bad.active{background:#FDECEC;color:var(--red);border-color:#E6AAAA}
.note{display:none;margin-top:9px}
.note.show{display:block}
.note input{
  width:100%;border:1px solid #F0C7C7;border-radius:9px;padding:10px 11px;background:#FFF8F8;
}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);border-top:1px solid #DCE3EC;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.bottom-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary,.secondary{
  border:none;border-radius:12px;padding:12px 10px;font-weight:800;
}
.primary{background:var(--navy);color:white}
.secondary{background:#EAF2FB;color:var(--navy)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toolbtn{
  border:1px solid var(--line);background:white;border-radius:10px;padding:9px 11px;
  font-size:13px;font-weight:700;color:var(--navy)
}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  border-radius:999px;padding:5px 8px;background:#EAF2FB;color:var(--navy)
}
.history-card{
  background:white;border-radius:14px;border:1px solid #E6ECF3;padding:12px;margin-top:10px;
}
.history-title{font-weight:800;color:var(--navy);margin-bottom:8px}
.history-list{display:grid;gap:6px}
.history-row{display:grid;grid-template-columns:70px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.mini-bar{height:7px;background:#EDF1F6;border-radius:99px;overflow:hidden}
.mini-fill{height:100%;background:#4CAF50}
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:#111827;color:white;padding:10px 16px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){
  .grid2{grid-template-columns:1fr}
  h1{font-size:18px}
  .item-text{font-size:14px}
}

/* ===== V3 視覺優化 ===== */
body{
  background:
    radial-gradient(circle at top right, rgba(47,117,181,.09), transparent 30%),
    linear-gradient(180deg,#F7FAFD 0%,#EEF3F8 100%);
}
header{
  background:linear-gradient(135deg,#102A43 0%,#174A7E 55%,#2F75B5 100%);
  padding:16px 18px 14px;
}
.wrap{max-width:1040px;padding:18px 14px 100px}
.top-card{
  border:1px solid rgba(23,54,93,.08);
  box-shadow:0 8px 28px rgba(23,54,93,.08);
}
.item{
  border:1px solid rgba(23,54,93,.08);
  box-shadow:0 5px 18px rgba(23,54,93,.055);
  padding:15px;
  transition:.18s ease;
}
.item:has(.status-btn.bad.active){
  border-color:#F0B6B6;
  box-shadow:0 7px 22px rgba(198,40,40,.08);
  background:linear-gradient(180deg,#FFFFFF 0%,#FFF9F9 100%);
}
.item:has(.status-btn.ok.active){
  border-color:#B9DEC0;
  background:linear-gradient(180deg,#FFFFFF 0%,#FBFFFC 100%);
}
.item-head{align-items:center}
.num{
  width:34px;height:34px;flex-basis:34px;border-radius:11px;
  background:linear-gradient(135deg,#E7F0FA,#DCEAF8);
  font-size:14px;
}
.item-text{font-size:15px;line-height:1.65}
.status-row{gap:10px}
.status-btn{
  min-height:44px;
  border-radius:12px;
  font-size:14px;
  transition:.15s ease;
}
.status-btn.ok.active{
  background:linear-gradient(135deg,#E7F6EA,#DDF2E2);
  border-color:#94C99C;color:#247132;
  box-shadow:inset 0 0 0 1px rgba(46,125,50,.04);
}
.status-btn.bad.active{
  background:linear-gradient(135deg,#FDEBEB,#FBE2E2);
  border-color:#E2A3A3;color:#B71C1C;
}
.abnormal-panel{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  background:#FFF7F7;
  border:1px solid #F1CACA;
}
.abnormal-panel.show{display:block}
.ab-title{
  display:flex;align-items:center;gap:8px;
  color:#B42318;font-weight:800;font-size:14px;margin-bottom:12px
}
.ab-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.field-full{grid-column:1 / -1}
.ab-field label{
  display:block;
  font-size:12px;
  color:#7A3E3E;
  font-weight:700;
  margin-bottom:5px;
}
.ab-field input,.ab-field select,.ab-field textarea{
  width:100%;
  border:1px solid #E6BABA;
  border-radius:10px;
  background:#FFF;
  padding:10px 11px;
  color:#1F2937;
}
.ab-field textarea{min-height:72px}
.ab-hint{
  margin-top:8px;
  font-size:11px;
  color:#9A5B5B;
}
.section-title{
  margin-top:20px;
  font-size:15px;
}
.time-btn{
  box-shadow:0 3px 9px rgba(23,54,93,.04);
}
.time-btn.active{
  background:linear-gradient(135deg,#17365D,#2F75B5);
  box-shadow:0 5px 14px rgba(23,54,93,.18);
}
.primary{
  background:linear-gradient(135deg,#17365D,#2F75B5);
  box-shadow:0 6px 18px rgba(23,54,93,.18);
}
.toolbtn{
  background:#F8FBFE;
}
.summary-banner{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.summary-chip{
  background:#F7FAFD;
  border:1px solid #E2EAF2;
  border-radius:12px;
  padding:10px 12px;
  text-align:center;
}
.summary-chip strong{
  display:block;
  font-size:18px;
  color:#17365D;
}
.summary-chip span{
  display:block;
  margin-top:3px;
  font-size:11px;
  color:#6B7280;
}
@media(max-width:620px){
  .ab-grid{grid-template-columns:1fr}
  .field-full{grid-column:auto}
  .summary-banner{grid-template-columns:repeat(3,1fr)}
  .summary-chip{padding:9px 6px}
  .summary-chip strong{font-size:16px}
}


/* ===== V4 配色與版面優化：霧灰白 × 墨綠藍綠 ===== */
:root{
  --navy:#315C53;
  --blue:#5F8F83;
  --light:#F4F6F4;
  --line:#D9E1DD;
  --green:#3E7A5E;
  --red:#B84C4C;
  --amber:#C98A35;
  --text:#26332E;
  --muted:#718078;
  --card:#FFFFFF;
}
body{
  background:
    radial-gradient(circle at top right, rgba(95,143,131,.10), transparent 30%),
    linear-gradient(180deg,#F7F8F6 0%,#EEF2EF 100%);
}
header{
  background:linear-gradient(135deg,#294E47 0%,#3E6F64 55%,#648F85 100%);
  box-shadow:0 3px 18px rgba(49,92,83,.18);
}
.top-card{
  border:1px solid #E0E6E2;
  box-shadow:0 8px 24px rgba(49,92,83,.07);
}
.time-btn{
  color:#315C53;
  border-color:#CDD8D2;
  background:#FBFCFB;
}
.time-btn.active{
  background:linear-gradient(135deg,#315C53,#5F8F83);
  border-color:#315C53;
  box-shadow:0 5px 14px rgba(49,92,83,.16);
}
.section-title{
  color:#315C53;
}
.section-title::before{
  background:#6E9B90;
}
.num{
  background:linear-gradient(135deg,#E9F0ED,#DDE9E4);
  color:#315C53;
}
.item{
  border-color:#E3E9E5;
  box-shadow:0 4px 14px rgba(49,92,83,.05);
}
.item:has(.status-btn.ok.active){
  border-color:#B8D4C3;
  background:linear-gradient(180deg,#FFFFFF 0%,#F9FCFA 100%);
}
.item:has(.status-btn.bad.active){
  border-color:#E2B9B9;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFF9F8 100%);
}
.status-btn.ok.active{
  background:#E9F4ED;
  border-color:#AFCFBB;
  color:#33694D;
}
.status-btn.bad.active{
  background:#FBECEC;
  border-color:#DFAFAF;
  color:#A83D3D;
}
.abnormal-panel{
  background:#FFF8F7;
  border-color:#EBC8C3;
}
.ab-title{color:#A5463E}
.ab-field label{color:#7B4B45}
.ab-field input,.ab-field select,.ab-field textarea{
  border-color:#E5C7C3;
}
.progress-line{background:#E3E9E5}
.progress-bar{
  background:linear-gradient(90deg,#4E8068,#78A68D);
}
.summary-chip{
  background:#F4F7F5;
  border-color:#DFE7E2;
}
.summary-chip strong{
  color:#315C53;
}
.toolbtn{
  background:#F7FAF8;
  border-color:#DCE5E0;
  color:#315C53;
}
.primary{
  background:linear-gradient(135deg,#315C53,#5F8F83);
  box-shadow:0 6px 18px rgba(49,92,83,.18);
}
.secondary{
  background:#E8F0EC;
  color:#315C53;
}
.badge{
  background:rgba(255,255,255,.16);
  color:white;
  border:1px solid rgba(255,255,255,.18);
}
.history-card{
  border-color:#E2E8E4;
}
.history-title{color:#315C53}
.mini-fill{background:#6E9B90}


/* ===== V5 今日巡檢儀表板 ===== */
.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:12px;
}
.dash-card{
  background:#FFFFFF;
  border:1px solid #DFE7E2;
  border-radius:16px;
  padding:14px 15px;
  box-shadow:0 7px 20px rgba(49,92,83,.06);
}
.dash-label{
  font-size:12px;
  color:#75837B;
  font-weight:700;
  margin-bottom:6px;
}
.dash-value{
  font-size:28px;
  font-weight:900;
  color:#315C53;
  line-height:1;
}
.dash-sub{
  margin-top:6px;
  font-size:11px;
  color:#8A968F;
}
.dash-card.warn .dash-value{color:#B5742B}
.dash-card.danger .dash-value{color:#B84C4C}
.missing-card{
  background:#FFFFFF;
  border:1px solid #DFE7E2;
  border-radius:16px;
  padding:13px 14px;
  margin-bottom:12px;
  box-shadow:0 7px 20px rgba(49,92,83,.05);
}
.missing-title{
  font-size:13px;
  font-weight:800;
  color:#315C53;
  margin-bottom:9px;
}
.missing-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.missing-tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:999px;
  background:#FFF6E9;
  border:1px solid #EBCF9C;
  color:#9B6A25;
  font-size:12px;
  font-weight:800;
}
.missing-tag.done{
  background:#EDF6F0;
  border-color:#BDD6C7;
  color:#3E7A5E;
}
@media(max-width:760px){
  .dashboard{grid-template-columns:1fr 1fr}
}


/* ===== V6 管理者編輯模式 ===== */
.admin-btn{
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}
.modal-mask{
  position:fixed; inset:0; z-index:100;
  background:rgba(20,32,28,.52);
  display:none; align-items:flex-end; justify-content:center;
}
.modal-mask.show{display:flex}
.admin-modal{
  width:min(980px,100%);
  max-height:92vh;
  background:#F7F9F7;
  border-radius:22px 22px 0 0;
  overflow:hidden;
  box-shadow:0 -10px 40px rgba(0,0,0,.18);
}
.admin-head{
  background:linear-gradient(135deg,#294E47,#5F8F83);
  color:#fff;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.admin-head h2{margin:0;font-size:18px}
.admin-body{
  padding:14px;
  overflow:auto;
  max-height:calc(92vh - 132px);
}
.admin-toolbar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px
}
.admin-toolbar button{
  border:1px solid #D8E2DD;
  background:#fff;
  color:#315C53;
  border-radius:10px;
  padding:9px 11px;
  font-weight:800;
}
.admin-list{display:grid;gap:9px}
.admin-item{
  background:#fff;
  border:1px solid #DFE7E2;
  border-radius:14px;
  padding:12px;
  display:grid;
  grid-template-columns:44px 160px 1fr 110px;
  gap:9px;
  align-items:start;
}
.admin-no{
  height:38px;border-radius:10px;background:#E9F0ED;
  color:#315C53;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.admin-item input,.admin-item textarea{
  width:100%;border:1px solid #D7E1DB;border-radius:10px;
  padding:9px 10px;background:#fff;color:#26332E;
}
.admin-item textarea{min-height:64px;resize:vertical}
.admin-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:6px
}
.admin-actions button{
  border:1px solid #D8E2DD;
  background:#F8FAF9;
  border-radius:9px;
  padding:8px 6px;
  color:#315C53;
  font-weight:800;
}
.admin-actions .delete{
  color:#A84444;background:#FFF7F7;border-color:#E8C3C3;
}
.admin-foot{
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid #DFE7E2;
  display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.admin-foot button{
  border:none;border-radius:12px;padding:12px;font-weight:900
}
.admin-cancel{background:#E9EFEC;color:#315C53}
.admin-save{background:linear-gradient(135deg,#315C53,#5F8F83);color:#fff}
.admin-note{
  font-size:12px;color:#6F7D75;margin:4px 2px 12px;line-height:1.6
}
@media(max-width:760px){
  .admin-item{
    grid-template-columns:38px 1fr;
  }
  .admin-item .cat-field{grid-column:2}
  .admin-item .text-field{grid-column:1 / -1}
  .admin-actions{grid-column:1 / -1;grid-template-columns:repeat(4,1fr)}
}

</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>百麒設備巡視檢查</h1>
      <div class="sub">每 2 小時巡視一次・異常即時紀錄</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="admin-btn" onclick="openAdmin()">管理設定</button>
      <span class="badge" id="slotBadge">08:00</span>
    </div>
  </div>
</header>

<div class="wrap">
<div class="dashboard">
    <div class="dash-card">
      <div class="dash-label">今日完成率</div>
      <div class="dash-value" id="dashCompletion">0%</div>
      <div class="dash-sub">依 8 個巡檢時段計算</div>
    </div>
    <div class="dash-card">
      <div class="dash-label">已完成時段</div>
      <div class="dash-value" id="dashDoneSlots">0 / 8</div>
      <div class="dash-sub">全部巡檢項目完成才計入</div>
    </div>
    <div class="dash-card warn">
      <div class="dash-label">尚未完成</div>
      <div class="dash-value" id="dashMissingSlots">8</div>
      <div class="dash-sub">今日待巡時段</div>
    </div>
    <div class="dash-card danger">
      <div class="dash-label">今日異常</div>
      <div class="dash-value" id="dashBadCount">0</div>
      <div class="dash-sub">所有時段異常總數</div>
    </div>
  </div>

  <div class="missing-card">
    <div class="missing-title">今日時段狀態</div>
    <div class="missing-list" id="missingList"></div>
  </div>
  <div class="top-card">
    <div class="grid2">
      <div>
        <label class="small">巡檢日期</label>
        <input type="date" id="date">
      </div>
      <div>
        <label class="small">巡檢人員（固定）</label>
        <input type="text" id="inspector" value="簡通延" readonly style="width:100%;border:1px solid #D8E0DC;border-radius:12px;padding:11px 12px;background:#F2F5F3;color:#40514A;font-weight:800">
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">巡檢時段</label>
      <div class="time-strip" id="timeStrip"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-line"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-text">
        <span id="progressText">0 / 21 完成</span>
        <span id="abnormalText">異常 0 項</span>
      </div>
      <div class="summary-banner">
        <div class="summary-chip"><strong id="sumDone">0</strong><span>本時段已檢</span></div>
        <div class="summary-chip"><strong id="sumBad">0</strong><span>本時段異常</span></div>
        <div class="summary-chip"><strong id="sumLeft">${ITEMS.length}</strong><span>尚未巡檢</span></div>
      </div>
    </div>

    <div class="toolbar">
      <button class="toolbtn" onclick="markAllOK()">全部正常</button>
      <button class="toolbtn" onclick="clearCurrent()">清除此時段</button>
      <button class="toolbtn" onclick="showTodaySummary()">今日總覽</button>
      <button class="toolbtn" onclick="exportCSV()">匯出 CSV</button>
      <button class="toolbtn" onclick="exportDailyImage()">匯出今日總表圖片</button>
    </div>
  </div>

  <div id="checklist"></div>

  <div class="top-card">
    <label class="small">本時段補充說明</label>
    <textarea id="generalNote" placeholder="例如：已通知維修、已補鹽、已處理漏氣…"></textarea>
  </div>

  <div class="top-card">
    <div class="history-title">今日巡檢完成度</div>
    <div class="history-list" id="history"></div>
  </div>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="secondary" onclick="prevSlot()">上一時段</button>
    <button class="primary" onclick="saveCurrent(true)">儲存本時段</button>
  </div>
</div>


<div class="modal-mask" id="adminMask">
  <div class="admin-modal">
    <div class="admin-head">
      <div>
        <h2>巡檢項目管理</h2>
        <div style="font-size:12px;opacity:.85;margin-top:3px">新增、修改、刪除、排序與分類</div>

      </div>
      <div class="admin-note">
        這裡修改後會立即套用到巡檢前台。既有歷史紀錄會保留當時的勾選資料；
        若大幅刪除或重排項目，建議從隔天開始使用新版清單。

  </div>
</div>

<div class="toast" id="toast">已儲存</div>

<script>
const TIMES=["08:00","10:00","12:00","14:00","16:00","18:00","20:00","22:00"];

const DEFAULT_ITEMS=[
 {cat:"鍋爐・水處理・空壓",t:"鍋爐作業是否正常，管線有無洩漏。"},
 {cat:"鍋爐・水處理・空壓",t:"檢查鍋爐用水及軟化是否正常；鹽水是否有補；清罐劑是否足夠。"},
 {cat:"鍋爐・水處理・空壓",t:"檢查錳砂作業是否正常、各機件是否正常，P 水是否足夠。"},
 {cat:"鍋爐・水處理・空壓",t:"檢查軟水各機件是否正常，鹽水桶是否補上。"},
 {cat:"鍋爐・水處理・空壓",t:"檢查空壓機作業是否正常，冷凍機是否有開啟。"},
 {cat:"洗滌設備",t:"檢查 NEO-100、IWE-50、IWE-35 洗衣機後方是否漏氣、漏水，各部機件是否正常；洗衣機前方、洗機槽及原料放置周邊是否清潔。"},
 {cat:"烘乾・整燙設備",t:"檢查 PFX-120、60 烘乾機溫度是否在正常工作範圍；熱交換器、管線有無洩漏或滲漏。"},
 {cat:"整燙・堆疊設備",t:"檢查 ES4 操縱夾作動有無異常。"},
 {cat:"整燙・堆疊設備",t:"檢查 IRT 作動是否正常；蒸氣、回水有無滲漏；鏈條狀況及各機件是否正常。"},
 {cat:"整燙・堆疊設備",t:"檢查 N4 堆疊機 1/4、3/4 離合器是否正常分離；偵測影像及各部機件作業是否正常。"},
 {cat:"折疊設備",t:"檢查 TB-30、60、80 毛巾折疊機作業狀態，各部機件是否正常。"},
 {cat:"整燙・堆疊設備",t:"檢查 ES3 操縱夾作業時各部機件是否正常。"},
 {cat:"整燙・堆疊設備",t:"檢查 ICC 平燙機管線有無洩漏，作業時各部機件是否正常。"},
 {cat:"整燙・堆疊設備",t:"檢查 SMF 堆疊機作業狀態有無異常。"},
 {cat:"烘乾・整燙設備",t:"檢查整燙區蒸氣、回水有無洩漏；壓板機、襯衫機作業是否正常。"},
 {cat:"公用設備",t:"巡視所有水塔有無異常。"},
 {cat:"公用設備",t:"巡視熱水桶電眼作業是否正常。"},
 {cat:"乾洗設備",t:"檢查 D01-16D 乾洗機作業是否正常，乾洗油是否在正常液位。"},
 {cat:"環境・人員",t:"各作業區域周遭是否清潔。"},
 {cat:"環境・人員",t:"各組人員是否在規定位置作業。"},
 {cat:"異常應變",t:"如有突發狀況，是否已完成必要人員調配並以最快方式排除問題。"}
];
let ITEMS = loadCustomItems();

function loadCustomItems(){
  try{
    const saved=JSON.parse(localStorage.getItem("baiqi_custom_items")||"null");
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return DEFAULT_ITEMS.map(x=>({...x}));
}

let currentSlot=TIMES[0];
const dateEl=document.getElementById("date");
const inspectorEl=document.getElementById("inspector");
const checklistEl=document.getElementById("checklist");
const generalNoteEl=document.getElementById("generalNote");

function todayStr(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function getClosestSlot(){
  const h=new Date().getHours();
  let best=TIMES[0];
  for(const t of TIMES){ if(parseInt(t)<=h) best=t; }
  return best;
}
function key(){ return `baiqi_check_${dateEl.value}`; }
function loadDay(){
  try{return JSON.parse(localStorage.getItem(key()))||{inspector:"",slots:{}}}catch(e){return{inspector:"",slots:{}}}
}
function saveDay(data){ localStorage.setItem(key(),JSON.stringify(data)); }

function buildTimes(){
  const box=document.getElementById("timeStrip");
  box.innerHTML="";
  const day=loadDay();
  TIMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="time-btn"+(t===currentSlot?" active":"");
    const slot=day.slots?.[t];
    if(slot && slot.items && slot.items.filter(x=>x.status).length===ITEMS.length) b.classList.add("done");
    b.textContent=t;
    b.onclick=()=>{ saveCurrent(false); currentSlot=t; renderAll(); };
    box.appendChild(b);
  });
  document.getElementById("slotBadge").textContent=currentSlot;
}

function renderChecklist(){
  checklistEl.innerHTML="";
  const day=loadDay();
  const slot=day.slots?.[currentSlot]||{};
  const values=slot.items||ITEMS.map(()=>({status:"",note:""}));
  let currentCat="";
  ITEMS.forEach((it,i)=>{
    if(it.cat!==currentCat){
      currentCat=it.cat;
      const s=document.createElement("div");
      s.className="section-title";
      s.textContent=currentCat;
      checklistEl.appendChild(s);
    }
    const v=values[i]||{status:"",note:""};
    const card=document.createElement("div");
    card.className="item";
    card.innerHTML=`
      <div class="item-head">
        <div class="num">${i+1}</div>
        <div class="item-text">${it.t}</div>
      </div>
      <div class="status-row">
        <button class="status-btn ok ${v.status==="ok"?"active":""}" data-i="${i}" data-s="ok">✓ 正常</button>
        <button class="status-btn bad ${v.status==="bad"?"active":""}" data-i="${i}" data-s="bad">! 異常</button>
      </div>
      <div class="abnormal-panel ${v.status==="bad"?"show":""}" id="noteWrap${i}">
        <div class="ab-title">⚠ 異常處理紀錄</div>
        <div class="ab-grid">
          <div class="ab-field field-full">
            <label>異常情況</label>
            <textarea id="abCondition${i}" placeholder="例：管線接頭處有輕微漏水">${escapeHtml(v.condition||v.note||"")}</textarea>
          </div>
          <div class="ab-field">
            <label>可能原因</label>
            <input type="text" id="abCause${i}" value="${escapeHtml(v.cause||"")}" placeholder="例：接頭鬆動、墊片老化">
          </div>
          <div class="ab-field">
            <label>處理人員</label>
            <input type="text" id="abHandler${i}" value="${escapeHtml(v.handler||"")}" placeholder="輸入處理人員">
          </div>
          <div class="ab-field field-full">
            <label>排除／處理方法</label>
            <textarea id="abAction${i}" placeholder="請填寫已採取的排除方式">${escapeHtml(v.action||"")}</textarea>
          </div>
          <div class="ab-field">
            <label>處理結果</label>
            <select id="abResult${i}">
              <option value="">請選擇</option>
              <option value="已排除" ${v.result==="已排除"?"selected":""}>已排除</option>
              <option value="暫時處理" ${v.result==="暫時處理"?"selected":""}>暫時處理</option>
              <option value="待維修" ${v.result==="待維修"?"selected":""}>待維修</option>
              <option value="停機處理" ${v.result==="停機處理"?"selected":""}>停機處理</option>
            </select>
          </div>
          <div class="ab-field">
            <label>完成時間</label>
            <input type="time" id="abTime${i}" value="${escapeHtml(v.finishTime||"")}">
          </div>
        </div>
        <div class="ab-hint">異常項目建議填寫完整，方便後續追蹤及主管確認。</div>
      </div>`;
    checklistEl.appendChild(card);
  });
  checklistEl.querySelectorAll(".status-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      setStatus(+btn.dataset.i,btn.dataset.s);
    });
  });
  checklistEl.querySelectorAll(".abnormal-panel input,.abnormal-panel textarea,.abnormal-panel select").forEach(el=>{
    el.addEventListener("input",autoSave);
    el.addEventListener("change",autoSave);
  });
  generalNoteEl.value=slot.generalNote||"";
  updateProgress();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function collectItems(){
  const out=[];
  for(let i=0;i<ITEMS.length;i++){
    const ok=document.querySelector(`.status-btn.ok[data-i="${i}"]`);
    const bad=document.querySelector(`.status-btn.bad[data-i="${i}"]`);
    let status="";
    if(ok?.classList.contains("active")) status="ok";
    if(bad?.classList.contains("active")) status="bad";
    out.push({
      status,
      condition:document.getElementById(`abCondition${i}`)?.value||"",
      cause:document.getElementById(`abCause${i}`)?.value||"",
      action:document.getElementById(`abAction${i}`)?.value||"",
      result:document.getElementById(`abResult${i}`)?.value||"",
      handler:document.getElementById(`abHandler${i}`)?.value||"",
      finishTime:document.getElementById(`abTime${i}`)?.value||""
    });
  }
  return out;
}
function setStatus(i,status){
  const ok=document.querySelector(`.status-btn.ok[data-i="${i}"]`);
  const bad=document.querySelector(`.status-btn.bad[data-i="${i}"]`);
  const wrap=document.getElementById(`noteWrap${i}`);
  if(status==="ok"){
    ok.classList.add("active");bad.classList.remove("active");wrap.classList.remove("show");
  }else{
    bad.classList.add("active");ok.classList.remove("active");wrap.classList.add("show");
    setTimeout(()=>document.getElementById(`abCondition${i}`)?.focus(),50);
  }
  autoSave();
  updateProgress();
}
function updateProgress(){
  const items=collectItems();
  const done=items.filter(x=>x.status).length;
  const bad=items.filter(x=>x.status==="bad").length;
  document.getElementById("progressBar").style.width=`${done/ITEMS.length*100}%`;
  document.getElementById("progressText").textContent=`${done} / ${ITEMS.length} 完成`;
  document.getElementById("abnormalText").textContent=`異常 ${bad} 項`;
  document.getElementById("sumDone").textContent=done;
  document.getElementById("sumBad").textContent=bad;
  document.getElementById("sumLeft").textContent=ITEMS.length-done;
}
function autoSave(){
  clearTimeout(window.__saveTimer);
  window.__saveTimer=setTimeout(()=>saveCurrent(false),250);
}
function saveCurrent(showToast=true){
  if(!dateEl.value) return;
  const day=loadDay();
  day.inspector="簡通延";
  day.slots=day.slots||{};
  day.slots[currentSlot]={
    items:collectItems(),
    generalNote:generalNoteEl.value.trim(),
    updatedAt:new Date().toISOString()
  };
  saveDay(day);
  buildTimes(); renderHistory(); renderDashboard();
  if(showToast) toast("本時段已儲存");
}
function renderHistory(){
  const day=loadDay();
  const box=document.getElementById("history");
  box.innerHTML="";
  TIMES.forEach(t=>{
    const items=day.slots?.[t]?.items||[];
    const done=items.filter(x=>x.status).length;
    const bad=items.filter(x=>x.status==="bad").length;
    const row=document.createElement("div");
    row.className="history-row";
    row.innerHTML=`<strong>${t}</strong>
      <div class="mini-bar"><div class="mini-fill" style="width:${done/ITEMS.length*100}%"></div></div>
      <span style="text-align:right;color:${bad?'var(--red)':'var(--muted)'}">${done}/${ITEMS.length}${bad?`・異常${bad}`:""}</span>`;
    box.appendChild(row);
  });
}
function markAllOK(){
  checklistEl.querySelectorAll(".status-btn.ok").forEach(b=>b.classList.add("active"));
  checklistEl.querySelectorAll(".status-btn.bad").forEach(b=>b.classList.remove("active"));
  checklistEl.querySelectorAll(".abnormal-panel").forEach(n=>n.classList.remove("show"));
  autoSave();updateProgress();toast("已全部標記正常");
}
function clearCurrent(){
  if(!confirm(`確定清除 ${currentSlot} 的巡檢紀錄？`)) return;
  const day=loadDay();
  if(day.slots) delete day.slots[currentSlot];
  saveDay(day);renderAll();toast("已清除此時段");
}
function prevSlot(){
  saveCurrent(false);
  let i=TIMES.indexOf(currentSlot);
  if(i>0) currentSlot=TIMES[i-1];
  renderAll();
  window.scrollTo({top:0,behavior:"smooth"});
}
function showTodaySummary(){
  const day=loadDay();
  let text=`${dateEl.value} 今日巡檢總覽\n`;
  TIMES.forEach(t=>{
    const items=day.slots?.[t]?.items||[];
    const done=items.filter(x=>x.status).length;
    const bad=items.filter(x=>x.status==="bad").length;
    text+=`${t}：${done}/${ITEMS.length}，異常 ${bad} 項\n`;
  });
  alert(text);
}
function exportCSV(){
  saveCurrent(false);
  const day=loadDay();
  const rows=[["日期","時段","巡檢人員","編號","分類","巡檢項目","結果","異常情況","可能原因","排除／處理方法","處理結果","處理人員","完成時間","時段補充說明"]];
  TIMES.forEach(t=>{
    const s=day.slots?.[t]; if(!s) return;
    ITEMS.forEach((it,i)=>{
      const v=s.items?.[i]||{};
      rows.push([dateEl.value,t,day.inspector||"",i+1,it.cat,it.t,v.status==="ok"?"正常":v.status==="bad"?"異常":"",v.condition||v.note||"",v.cause||"",v.action||"",v.result||"",v.handler||"",v.finishTime||"",s.generalNote||""]);
    });
  });
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`百麒巡檢_${dateEl.value}.csv`;a.click();
  URL.revokeObjectURL(a.href);
}

function exportDailyImage(){
  saveCurrent(false);
  const day=loadDay();
  const W=1600;
  const margin=70;
  const rowH=68;
  const matrixTop=420;
  const itemCellW=Math.min(48, Math.max(26, 1050/ITEMS.length));
  const matrixLeft=250;

  // collect abnormalities
  const abnormalities=[];
  TIMES.forEach(t=>{
    const s=day.slots?.[t];
    if(!s || !s.items) return;
    s.items.forEach((v,i)=>{
      if(v?.status==="bad"){
        abnormalities.push({
          time:t,
          no:i+1,
          item:ITEMS[i].t,
          condition:v.condition||v.note||"未填寫",
          cause:v.cause||"",
          action:v.action||"未填寫",
          result:v.result||"未選擇",
          handler:v.handler||"",
          finishTime:v.finishTime||""
        });
      }
    });
  });

  const abnormalLineH=82;
  const abnormalBlockH = abnormalities.length
    ? 90 + abnormalities.length * abnormalLineH
    : 120;
  const H = matrixTop + TIMES.length*rowH + 130 + abnormalBlockH + 120;

  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d");

  // background
  ctx.fillStyle="#F5F7FA"; ctx.fillRect(0,0,W,H);

  // header
  ctx.fillStyle="#17365D"; ctx.fillRect(0,0,W,180);
  ctx.fillStyle="#FFFFFF";
  ctx.font='bold 54px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText("百麒設備巡視－今日總表",margin,78);
  ctx.font='28px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText(`${dateEl.value}　巡檢人員：${day.inspector||"未填寫"}`,margin,132);

  // summary metrics
  let totalDone=0,totalBad=0,completedSlots=0;
  TIMES.forEach(t=>{
    const items=day.slots?.[t]?.items||[];
    const done=items.filter(x=>x.status).length;
    const bad=items.filter(x=>x.status==="bad").length;
    totalDone+=done; totalBad+=bad;
    if(done===ITEMS.length) completedSlots++;
  });
  const possible=TIMES.length*ITEMS.length;
  const pct=Math.round(totalDone/possible*100);

  const cards=[
    {label:"今日完成率",value:`${pct}%`},
    {label:"已完成時段",value:`${completedSlots} / ${TIMES.length}`},
    {label:"已檢查項目",value:`${totalDone} / ${possible}`},
    {label:"異常項目",value:`${totalBad}`}
  ];
  const cardY=210, gap=24, cardW=(W-margin*2-gap*3)/4, cardH=145;
  cards.forEach((c,i)=>{
    const x=margin+i*(cardW+gap);
    ctx.fillStyle="#FFFFFF"; roundRect(ctx,x,cardY,cardW,cardH,18,true,false);
    ctx.fillStyle="#6B7280"; ctx.font='24px "Microsoft JhengHei","Noto Sans TC",sans-serif';
    ctx.fillText(c.label,x+24,cardY+42);
    ctx.fillStyle=i===3 && totalBad>0 ? "#C62828" : "#17365D";
    ctx.font='bold 42px "Microsoft JhengHei","Noto Sans TC",sans-serif';
    ctx.fillText(c.value,x+24,cardY+102);
  });

  // matrix title
  ctx.fillStyle="#17365D";
  ctx.font='bold 30px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText("各時段巡檢總覽",margin,matrixTop-35);

  // matrix headers
  ctx.fillStyle="#E9EFF7";
  roundRect(ctx,margin,matrixTop-10,W-margin*2,58,12,true,false);
  ctx.fillStyle="#17365D"; ctx.font='bold 20px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText("時段",margin+24,matrixTop+27);
  ctx.fillText("完成",margin+105,matrixTop+27);
  ctx.fillText("異常",margin+170,matrixTop+27);
  for(let i=0;i<ITEMS.length;i++){
    const x=matrixLeft+i*itemCellW;
    ctx.save();
    ctx.translate(x+13,matrixTop+36);
    ctx.rotate(-Math.PI/3.3);
    ctx.fillText(String(i+1),0,0);
    ctx.restore();
  }

  // rows
  TIMES.forEach((t,ri)=>{
    const y=matrixTop+58+ri*rowH;
    ctx.fillStyle=ri%2===0?"#FFFFFF":"#F9FBFD";
    ctx.fillRect(margin,y,W-margin*2,rowH-2);
    const items=day.slots?.[t]?.items||[];
    const done=items.filter(x=>x.status).length;
    const bad=items.filter(x=>x.status==="bad").length;

    ctx.fillStyle="#1F2937"; ctx.font='bold 24px "Microsoft JhengHei","Noto Sans TC",sans-serif';
    ctx.fillText(t,margin+18,y+42);
    ctx.font='20px "Microsoft JhengHei","Noto Sans TC",sans-serif';
    ctx.fillStyle=done===ITEMS.length?"#2E7D32":"#6B7280";
    ctx.fillText(`${done}/${ITEMS.length}`,margin+105,y+42);
    ctx.fillStyle=bad>0?"#C62828":"#6B7280";
    ctx.fillText(String(bad),margin+180,y+42);

    for(let i=0;i<ITEMS.length;i++){
      const v=items[i];
      const cx=matrixLeft+i*itemCellW+10;
      const cy=y+32;
      if(v?.status==="ok"){
        ctx.fillStyle="#2E7D32"; circle(ctx,cx,cy,11);
        ctx.strokeStyle="#FFFFFF";ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(cx-5,cy);ctx.lineTo(cx-1,cy+5);ctx.lineTo(cx+7,cy-6);ctx.stroke();
      }else if(v?.status==="bad"){
        ctx.fillStyle="#C62828"; circle(ctx,cx,cy,11);
        ctx.fillStyle="#FFFFFF";ctx.font='bold 18px sans-serif';ctx.textAlign="center";
        ctx.fillText("!",cx,cy+6);ctx.textAlign="left";
      }else{
        ctx.strokeStyle="#CBD5E1";ctx.lineWidth=2;circleStroke(ctx,cx,cy,10);
      }
    }
  });

  // legend
  let legendY=matrixTop+58+TIMES.length*rowH+35;
  ctx.font='20px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillStyle="#2E7D32";circle(ctx,margin+12,legendY-6,9);
  ctx.fillStyle="#374151";ctx.fillText("正常",margin+30,legendY);
  ctx.fillStyle="#C62828";circle(ctx,margin+115,legendY-6,9);
  ctx.fillStyle="#374151";ctx.fillText("異常",margin+133,legendY);
  ctx.strokeStyle="#CBD5E1";circleStroke(ctx,margin+220,legendY-6,8);
  ctx.fillStyle="#374151";ctx.fillText("未巡檢",margin+238,legendY);

  // abnormalities
  const abY=legendY+65;
  ctx.fillStyle="#17365D";
  ctx.font='bold 30px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText("今日異常紀錄",margin,abY);

  const boxY=abY+28;
  ctx.fillStyle="#FFFFFF";
  roundRect(ctx,margin,boxY,W-margin*2,abnormalBlockH,16,true,false);

  if(abnormalities.length===0){
    ctx.fillStyle="#2E7D32";
    ctx.font='bold 28px "Microsoft JhengHei","Noto Sans TC",sans-serif';
    ctx.fillText("✓ 今日目前無異常紀錄",margin+28,boxY+68);
  }else{
    abnormalities.forEach((a,i)=>{
      const y=boxY+44+i*abnormalLineH;
      ctx.fillStyle="#C62828";
      ctx.font='bold 22px "Microsoft JhengHei","Noto Sans TC",sans-serif';
      ctx.fillText(`${a.time}　#${a.no}`,margin+28,y);
      ctx.fillStyle="#374151";
      ctx.font='20px "Microsoft JhengHei","Noto Sans TC",sans-serif';
      const text1=`${shortText(a.item,34)}｜異常：${shortText(a.condition,34)}`;
      ctx.fillText(text1,margin+170,y);
      ctx.fillStyle="#6B7280";
      ctx.font='18px "Microsoft JhengHei","Noto Sans TC",sans-serif';
      const text2=`處理：${shortText(a.action,40)}｜結果：${a.result}${a.handler?`｜人員：${a.handler}`:""}`;
      ctx.fillText(text2,margin+170,y+28);
      if(i<abnormalities.length-1){
        ctx.strokeStyle="#E5E7EB";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(margin+25,y+40);ctx.lineTo(W-margin-25,y+40);ctx.stroke();
      }
    });
  }

  // footer
  ctx.fillStyle="#6B7280";
  ctx.font='18px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  ctx.fillText(`產出時間：${new Date().toLocaleString("zh-TW")}`,margin,H-42);
  ctx.textAlign="right";
  ctx.fillText("百麒設備巡視檢查系統",W-margin,H-42);
  ctx.textAlign="left";

  const link=document.createElement("a");
  link.download=`百麒今日巡檢總表_${dateEl.value}.png`;
  link.href=canvas.toDataURL("image/png");
  link.click();
  toast("今日總表圖片已匯出");
}

function shortText(s,n){
  s=String(s||"");
  return s.length>n?s.slice(0,n-1)+"…":s;
}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function circleStroke(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}

function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1500);
}

function renderDashboard(){
  const day=loadDay();
  let totalChecked=0;
  let badCount=0;
  let completedSlots=0;
  const missing=[];
  const list=document.getElementById("missingList");
  if(list) list.innerHTML="";

  TIMES.forEach(t=>{
    const items=day.slots?.[t]?.items||[];
    const checked=items.filter(x=>x.status).length;
    const bad=items.filter(x=>x.status==="bad").length;
    totalChecked+=checked;
    badCount+=bad;
    const isDone=checked===ITEMS.length;
    if(isDone) completedSlots++;
    else missing.push(t);

    if(list){
      const tag=document.createElement("span");
      tag.className="missing-tag"+(isDone?" done":"");
      tag.textContent=isDone?`${t} 已完成`:`${t} 未完成`;
      list.appendChild(tag);
    }
  });

  const totalPossible=TIMES.length*ITEMS.length;
  const pct=Math.round((totalChecked/totalPossible)*100);

  document.getElementById("dashCompletion").textContent=`${pct}%`;
  document.getElementById("dashDoneSlots").textContent=`${completedSlots} / ${TIMES.length}`;
  document.getElementById("dashMissingSlots").textContent=missing.length;
  document.getElementById("dashBadCount").textContent=badCount;
}


let adminDraft=[];

function openAdmin(){
  adminDraft=ITEMS.map(x=>({cat:x.cat||"",t:x.t||""}));
  renderAdminList();
  document.getElementById("adminMask").classList.add("show");
}
function closeAdmin(){
  document.getElementById("adminMask").classList.remove("show");
}
function renderAdminList(){
  const box=document.getElementById("adminList");
  box.innerHTML="";
  adminDraft.forEach((it,i)=>{
    const row=document.createElement("div");
    row.className="admin-item";
    row.innerHTML=`
      <div class="admin-no">${i+1}</div>
      <div class="cat-field">
        <input type="text" value="${escapeHtml(it.cat||"")}" data-i="${i}" data-field="cat" placeholder="分類">
      </div>
      <div class="text-field">
        <textarea data-i="${i}" data-field="t" placeholder="巡檢項目內容">${escapeHtml(it.t||"")}</textarea>
      </div>
      <div class="admin-actions">
        <button onclick="adminMove(${i},-1)">↑</button>
        <button onclick="adminMove(${i},1)">↓</button>
        <button onclick="adminDuplicate(${i})">複製</button>
        <button class="delete" onclick="adminDelete(${i})">刪除</button>
      </div>`;
    box.appendChild(row);
  });
  box.querySelectorAll("input,textarea").forEach(el=>{
    el.addEventListener("input",()=>{
      const i=+el.dataset.i;
      adminDraft[i][el.dataset.field]=el.value;
    });
  });
}
function adminAddItem(){
  adminDraft.push({cat:"其他",t:""});
  renderAdminList();
  const body=document.querySelector(".admin-body");
  setTimeout(()=>body.scrollTo({top:body.scrollHeight,behavior:"smooth"}),50);
}
function adminDelete(i){
  if(adminDraft.length<=1){ alert("至少要保留 1 個巡檢項目。"); return; }
  if(!confirm(`確定刪除第 ${i+1} 項？`)) return;
  adminDraft.splice(i,1);
  renderAdminList();
}
function adminDuplicate(i){
  adminDraft.splice(i+1,0,{...adminDraft[i]});
  renderAdminList();
}
function adminMove(i,dir){
  const j=i+dir;
  if(j<0 || j>=adminDraft.length) return;
  [adminDraft[i],adminDraft[j]]=[adminDraft[j],adminDraft[i]];
  renderAdminList();
}
function saveAdminItems(){
  const cleaned=adminDraft
    .map(x=>({cat:(x.cat||"").trim()||"其他",t:(x.t||"").trim()}))
    .filter(x=>x.t);
  if(!cleaned.length){ alert("請至少保留一個有內容的巡檢項目。"); return; }

  localStorage.setItem("baiqi_custom_items",JSON.stringify(cleaned));
  ITEMS=cleaned;
  closeAdmin();
  renderAll();
  toast("巡檢項目已更新");
}
function resetItems(){
  if(!confirm("確定還原成最初的 21 項巡檢內容？")) return;
  adminDraft=DEFAULT_ITEMS.map(x=>({...x}));
  renderAdminList();
}

function renderAll(){
  const day=loadDay();
  inspectorEl.value="簡通延";
  buildTimes();renderChecklist();renderHistory();renderDashboard();
}
dateEl.addEventListener("change",()=>{currentSlot=getClosestSlot();renderAll()});

generalNoteEl.addEventListener("input",autoSave);

dateEl.value=todayStr();
currentSlot=getClosestSlot();
renderAll();
</script>
